name: GitHub Activity Sync

# Calls /api/github/sync on a schedule, so the admin-configured repos'
# contribution calendar / commits / repo metadata stay fresh without
# anyone having to click "Sync Now" in the admin dashboard manually.
#
# Why GitHub Actions and not Vercel Cron: Vercel Cron only auto-injects an
# `Authorization: Bearer $CRON_SECRET` header for an env var literally
# named `CRON_SECRET`, and this project deliberately uses the more
# specific `GITHUB_SYNC_CRON_SECRET` name instead (see the doc comment in
# src/app/api/github/sync/route.ts). `vercel.json` cron entries can't set
# a custom header, so Vercel Cron alone can't authenticate against this
# endpoint as written — a scheduler that CAN send a custom header is
# needed, and since the repo already lives on GitHub, GitHub Actions'
# own `schedule:` trigger is the simplest option that needs no new
# service or cost.
#
# Setup (one-time):
#   1. The `GITHUB_SYNC_CRON_SECRET` value must already be set in Vercel's
#      environment variables (Project Settings → Environment Variables) —
#      this workflow doesn't set that, it just needs to send the SAME
#      value back to prove it's allowed to trigger a sync.
#   2. Add a matching GitHub Actions secret in THIS repo: Settings →
#      Secrets and variables → Actions → "New repository secret" →
#      name it SYNC_CRON_SECRET (NOT "GITHUB_SYNC_CRON_SECRET" — GitHub
#      reserves the "GITHUB_" prefix for its own built-in secrets and
#      refuses to let you create one starting with it; this is just the
#      name of the GitHub Actions secret, it doesn't need to match the
#      Vercel env var's name, only its VALUE), value = the exact same
#      secret used for GITHUB_SYNC_CRON_SECRET in Vercel.
#   3. Commit this file to the default branch (main) — GitHub only runs
#      `schedule:`-triggered workflows from the default branch, not from
#      feature branches or PRs.
#   4. Test it manually first: Actions tab → "GitHub Activity Sync" →
#      "Run workflow" (this is what `workflow_dispatch` below enables) —
#      confirm it succeeds, then check /admin/github shows an updated
#      "Last synced" time.
#
# Note on timing: GitHub's own `schedule:` trigger is "best effort" — on
# a busy queue it can fire several minutes (occasionally longer) later
# than the cron expression says, which is fine for this use case (an
# activity feed that's a few minutes stale doesn't matter), just don't
# rely on it for anything time-critical.
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) — adjust as needed
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Activity sync
        env:
          SYNC_SECRET: ${{ secrets.SYNC_CRON_SECRET }}
        run: |
          if [ -z "$SYNC_SECRET" ]; then
            echo "::error::SYNC_CRON_SECRET repository secret is not set. See the setup steps in this workflow file's comments."
            exit 1
          fi

          curl --fail --silent --show-error \
            --max-time 30 \
            -H "Authorization: Bearer $SYNC_SECRET" \
            "https://portofolio-2026-gilt.vercel.app/api/github/sync"
